# Car visuals. Leave `file` empty to use the built-in primitive car.
#
# Any glTF 2.0 model works (.glb or .gltf) - e.g. exported from Blender or
# produced by an image/text-to-3D generator. Put the files in data/models/.
#
# Best results: export the body WITHOUT wheels and one separate wheel model,
# so the wheels can spin, steer and move with the suspension. If your model
# has the wheels baked in, set body.includes_wheels = true.
#
# axes = gltf  -> standard glTF convention (+Y up, the car's nose faces +Z)
# axes = sim   -> already in simulator axes (x forward, y left, z up)
# scale = 0    -> auto-fit: body length = car length, wheel diameter = tyre
# yaw_deg      -> rotate if the model faces the wrong way (try 90, 180, -90)
# offset_*     -> fine placement in metres after auto-fit (x forward, z up)

[body]
file =
axes = gltf
scale = 0
yaw_deg = 0
offset_x = 0
offset_y = 0
offset_z = 0
includes_wheels = false

[wheel]
file =
axes = gltf
scale = 0
yaw_deg = 0
offset_x = 0
offset_y = 0
offset_z = 0
# The right-hand wheels are the left-hand model mirrored.
mirror_right = true
