# F1 2026 model generated by scripts/blender/build_car.py (editable source:
# art/blender/f1_2026.blend). Dimensions match data/cars/f1_2026_generic.ini,
# so no manual scale/offset is needed. Materials named "Livery*" take the
# colour from the car file ([visual] livery_rgb).
#
# To use your own model instead (Blender export, AI generator, ...), change
# the file names below; see car_model.ini for all options.

[body]
file = models/f1_2026_body.glb
axes = gltf
scale = 0
yaw_deg = 0
offset_x = 0
offset_y = 0
offset_z = 0
includes_wheels = false

[wheel]
file = models/f1_2026_wheel_front.glb
axes = gltf
scale = 0
mirror_right = true

[wheel_rear]
file = models/f1_2026_wheel_rear.glb
axes = gltf
scale = 0
