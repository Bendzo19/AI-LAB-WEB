unsprung_mass = 22            # [EST] per corner
spring_rate_n_per_mm = 150    # [EST] corner wheel rate
heave_rate_n_per_mm = 400     # [EST]
heave_gap_mm = 12             # [EST] travel before heave packer
heave_packer_rate_n_per_mm = 1500
arb_rate_n_per_mm = 120       # [EST] roll wheel rate
bump_stop_gap_mm = 22
bump_stop_rate_n_per_mm = 3000
