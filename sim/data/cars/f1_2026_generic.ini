# Generic 2026-regulation Formula 1 car.
#
# This is NOT a specific team's car. No team data is used; every value comes
# from public sources or engineering estimates. Confidence tags:
#   [REG]  taken from / derived from the published FIA 2026 regulations
#   [PUB]  public statements, broadcasts, published telemetry (FastF1)
#   [EST]  engineering estimate, plausible for the class; replace with data
# The benchmark (f1sim_bench) prints the resulting performance figures so each
# change can be checked against real-world numbers.

[car]
name = Generic F1 2026

[chassis]
mass_kg = 768                 # [REG] minimum mass incl. driver, no fuel
cg_height_mm = 280            # [EST]
weight_front = 0.455          # [EST] static front weight fraction
wheelbase_mm = 3400           # [REG] maximum wheelbase
inertia_roll = 180            # [EST] kg m^2
inertia_pitch = 950           # [EST]
inertia_yaw = 1050            # [EST]
length_mm = 5300              # [EST]
width_mm = 1900               # [REG] maximum width

[front]
