# Generic 2025-regulation Formula 1 car (ground-effect era, 2022-2025 rules).
#
# This is NOT a specific team's car. No team data is used; every value comes
# from public sources or engineering estimates. Confidence tags:
#   [REG]  taken from / derived from the published FIA 2022-2025 regulations
#   [PUB]  public statements, broadcasts, published telemetry (FastF1)
#   [EST]  engineering estimate, plausible for the class; replace with data
# Validation: f1sim_bench compares the result with public figures and
# 2025 qualifying lap times (docs/PHYSICS.md).

[car]
name = Generic F1 2025
description = Ground-effect era car (2022-2025 rules): DRS, 1.6 L V6 turbo hybrid with MGU-K and MGU-H

[chassis]
mass_kg = 800                 # [REG] 2025 minimum mass incl. driver, no fuel
cg_height_mm = 290            # [EST]
weight_front = 0.455          # [EST] static front weight fraction
wheelbase_mm = 3600           # [REG] maximum wheelbase (most cars ran close to it)
inertia_roll = 200            # [EST] kg m^2
inertia_pitch = 1150           # [EST]
inertia_yaw = 1250            # [EST]
length_mm = 5600              # [EST]
width_mm = 2000               # [REG] maximum width

[front]
track_m = 1.64                # [EST]
unsprung_mass = 24            # [EST] per corner
spring_rate_n_per_mm = 180    # [EST] corner wheel rate
heave_rate_n_per_mm = 550     # [EST]
heave_gap_mm = 10             # [EST] travel before heave packer
heave_packer_rate_n_per_mm = 1500
arb_rate_n_per_mm = 180       # [EST] roll wheel rate; front-biased so the inside front lifts first
bump_stop_gap_mm = 18
bump_stop_rate_n_per_mm = 3000
droop_travel_mm = 30
damper_bump_slow = 11000       # [EST] N s/m
damper_bump_fast = 3500
damper_rebound_slow = 14000
damper_rebound_fast = 5000
damper_knee_m_per_s = 0.08
static_camber_deg = -3.25     # [PUB] close to the Pirelli prescribed limit
static_toe_deg = -0.10        # toe-out
camber_gain_deg_per_mm = -0.03
roll_centre_height_mm = 35    # [EST]
anti_geometry_tan = 0.15      # [EST] anti-dive
ride_height_mm = 30           # [EST] static floor height at the front axle

[front_tyre]
radius_mm = 360               # [PUB] 18" rim, ~720 mm diameter
width_mm = 305                # [PUB] 2025 front tyre width
wheel_inertia = 1.0           # [EST] kg m^2 incl. rim and brake disc
vertical_stiffness_n_per_mm = 300
vertical_damping = 400
nominal_load_n = 5000
mu_lateral = 1.72             # [EST] warm slick, peak
mu_longitudinal = 1.80        # [EST]
load_sensitivity_lateral = -0.12
load_sensitivity_longitudinal = -0.10
peak_slip_angle_deg = 5.0     # [EST]
peak_slip_ratio = 0.10        # [EST]
peak_slip_load_growth = 0.10
shape_lateral = 1.45
curvature_lateral = -0.6
shape_longitudinal = 1.45
curvature_longitudinal = -0.4
pneumatic_trail_mm = 35       # [EST]
trail_zero_slip = 1.15        # trail vanishes just past the grip peak
lateral_carcass_stiffness_n_per_mm = 220
camber_thrust = 0.35
camber_optimal_deg = -1.5     # dynamic camber relative to the road at the grip peak
camber_sensitivity = 40
relaxation_length_long_mm = 120
relaxation_length_lat_mm = 220
rolling_resistance = 0.012
temp_optimal_c = 100          # [PUB] slicks work around 90-110 C
temp_window_c = 35
cold_grip_loss = 0.10
hot_grip_loss = 0.08
surface_temp_weight = 0.6
surface_heat_capacity = 2500
carcass_heat_capacity = 16000
surface_to_carcass = 260
surface_to_air_base = 5
surface_to_air_per_speed = 0.8
surface_to_track = 30
carcass_to_air = 12
friction_heat_share = 0.35
hysteresis_coeff = 0.012        # rolling-resistance power heats the carcass
cold_pressure_kpa = 150

