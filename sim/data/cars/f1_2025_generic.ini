shift_time_s = 0.03           # seamless-shift torque dip
clutch_max_torque = 900
gearbox_inertia = 0.02
diff_preload = 100            # [EST] Nm
diff_power_lock = 0.35
diff_coast_lock = 0.25
mguk_max_power_kw = 120       # [REG]
mguk_max_torque = 200
mguk_taper_start_kph = 999    # no speed taper before 2026
mguk_taper_end_kph = 1000
