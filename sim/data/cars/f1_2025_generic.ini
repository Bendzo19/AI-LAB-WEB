bias_front = 0.57
disc_heat_capacity = 1500
cooling_base = 2.0
cooling_per_speed = 0.9
temp_optimal_low_c = 350      # [PUB] carbon brakes need heat
temp_optimal_high_c = 1000
cold_factor = 0.60
fade_factor = 0.85

[steering]
ratio = 9.0                   # [EST] steering wheel / road wheel
lock_deg = 180                # [EST] steering wheel angle each side
ackermann = 0.0               # parallel steer
mechanical_trail_mm = 30
scrub_radius_mm = 20
weight_centering_mm = 12
