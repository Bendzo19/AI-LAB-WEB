mguk_efficiency = 0.95
coast_harvest_kw = 60         # [EST] off-throttle harvesting
deploy_per_lap_mj = 4.0         # [REG] ES -> MGU-K per lap
mguh_harvest_kw = 60          # [EST] exhaust recovery at full throttle
fuel_kg = 10                  # qualifying-style fuel load
fuel_lhv_mj_per_kg = 43
ice_thermal_efficiency = 0.50

[brakes]
